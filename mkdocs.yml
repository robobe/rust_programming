site_name: "Rust Programming: From Zero to Useful"
site_description: A practical, beginner-friendly path for learning Rust
site_dir: dist
theme:
  name: material
  logo: assets/rust-mark.svg
  favicon: assets/rust-mark.svg
  features:
    - content.code.copy
extra_javascript:
  - javascripts/quiz.js
  - javascripts/mermaid.mjs
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/quiz.css
  - stylesheets/mermaid.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Syllabus: syllabus.md
  - Module 0:
      - Topic index: modules/00-first-lesson/index.md
      - "Topic 1: Setup and Hello World": modules/00-first-lesson/01-setup-and-hello-world.md
      - From source to DEB: modules/00-first-lesson/02-from-source-to-deb.md
      - Linux compiler output: modules/00-first-lesson/03-linux-compiler-output.md
      - Workspace with a binary and library: modules/00-first-lesson/04-cargo-workspace.md
      - Cross-compile for Raspberry Pi Pico: modules/00-first-lesson/05-rp2040-cross-compile.md
  - "Module 1: Rust fundamentals":
      - Topic index: modules/01-fundamentals/index.md
      - "Topic 1: Fundamentals overview": modules/01-fundamentals/01-fundamentals-overview.md
      - "Topic 2: Variables, mutability, and shadowing": modules/01-fundamentals/02-variables-mutability-shadowing.md
      - "Topic 3: Scalar types and operators": modules/01-fundamentals/03-scalar-types-and-operators.md
      - "Topic 4: Arrays, tuples, strings, and vectors": modules/01-fundamentals/04-arrays-tuples-strings-vectors.md
      - "Topic 5: Functions, statements, and expressions": modules/01-fundamentals/05-functions-statements-expressions.md
      - "Topic 6: Conditions and pattern basics": modules/01-fundamentals/06-conditions-and-patterns.md
      - "Topic 7: Loops and ranges": modules/01-fundamentals/07-loops-and-ranges.md
      - "Topic 8: Cargo practice, tests, and compiler feedback": modules/01-fundamentals/08-cargo-tests-compiler-feedback.md
  - "Module 2: Ownership and borrowing":
      - Topic index: modules/02-ownership-and-borrowing/index.md
      - Values, variables, and scope: modules/02-ownership-and-borrowing/01-values-variables-scope.md
      - Move semantics: modules/02-ownership-and-borrowing/02-move-semantics.md
      - Copy and Clone: modules/02-ownership-and-borrowing/03-copy-and-clone.md
      - Shared borrowing: modules/02-ownership-and-borrowing/ownership-and-borrowing.md
      - Mutable borrowing: modules/02-ownership-and-borrowing/05-mutable-borrowing.md
      - Borrowing collections and iterators: modules/02-ownership-and-borrowing/06-borrowing-collections-and-iterators.md
      - Slices and API boundaries: modules/02-ownership-and-borrowing/07-slices-and-api-boundaries.md
      - "Topic 9: Ownership hands-on review": modules/02-ownership-and-borrowing/09-hands-on.md
  - "Module 3: Structs, enums, and data modeling":
      - Topic index: modules/03-structs-enums-and-data-modeling/index.md
      - Structs: modules/03-structs-enums-and-data-modeling/01-structs.md
      - Methods and associated functions: modules/03-structs-enums-and-data-modeling/02-methods.md
      - Enums: modules/03-structs-enums-and-data-modeling/03-enum.md
      - "Topic 4: Pattern matching and destructuring": modules/03-structs-enums-and-data-modeling/04-pattern-matching.md
      - "Topic 5: Option: representing missing values": modules/03-structs-enums-and-data-modeling/05-option.md
      - "Topic 6: Result: representing operation outcomes": modules/03-structs-enums-and-data-modeling/06-result.md
      - "Topic 7: Putting the task model together": modules/03-structs-enums-and-data-modeling/07-task-model.md
