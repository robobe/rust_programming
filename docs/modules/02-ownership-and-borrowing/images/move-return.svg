<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 370" role="img" aria-labelledby="title desc">
<title id="title">Returning a String transfers ownership back</title><desc id="desc">Before give_back call - Temporary String owns text - hello - Input created by String::from; Inside give_back - text parameter owns String - hello - Tail expression moves text out; After return - message owns String - hello - Dropped when message leaves scope. Conceptual snapshots, not literal addresses or compiler stack slots.</desc>
<style>text{font:14px sans-serif;fill:#1e293b}.heading{font-weight:700;font-size:17px}.small{font-size:12px}.panel{fill:#fff;stroke:#94a3b8}.owner{fill:#dbeafe;stroke:#2563eb}.heap{fill:#dcfce7;stroke:#16a34a}.released{fill:#f1f5f9;stroke:#64748b;stroke-dasharray:5 4}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker></defs>
<text x="510" y="28" text-anchor="middle" class="heading">Returning a String transfers ownership back</text>
<g transform="translate(15 48)"><rect width="320" height="275" rx="10" class="panel"/><text x="160" y="28" text-anchor="middle" class="heading">Before give_back call</text><text x="20" y="58" class="small">Conceptual stack / binding</text><rect x="20" y="68" width="280" height="55" rx="6" class="owner"/><text x="160" y="100" text-anchor="middle">Temporary String owns text</text><path d="M160 123 V170" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><text x="20" y="160" class="small">Heap</text><rect x="20" y="177" width="280" height="45" rx="6" class="heap"/><text x="160" y="205" text-anchor="middle">hello</text><text x="160" y="251" text-anchor="middle" class="small">Input created by String::from</text></g><g transform="translate(350 48)"><rect width="320" height="275" rx="10" class="panel"/><text x="160" y="28" text-anchor="middle" class="heading">Inside give_back</text><text x="20" y="58" class="small">Conceptual stack / binding</text><rect x="20" y="68" width="280" height="55" rx="6" class="owner"/><text x="160" y="100" text-anchor="middle">text parameter owns String</text><path d="M160 123 V170" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><text x="20" y="160" class="small">Heap</text><rect x="20" y="177" width="280" height="45" rx="6" class="heap"/><text x="160" y="205" text-anchor="middle">hello</text><text x="160" y="251" text-anchor="middle" class="small">Tail expression moves text out</text></g><g transform="translate(685 48)"><rect width="320" height="275" rx="10" class="panel"/><text x="160" y="28" text-anchor="middle" class="heading">After return</text><text x="20" y="58" class="small">Conceptual stack / binding</text><rect x="20" y="68" width="280" height="55" rx="6" class="owner"/><text x="160" y="100" text-anchor="middle">message owns String</text><path d="M160 123 V170" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><text x="20" y="160" class="small">Heap</text><rect x="20" y="177" width="280" height="45" rx="6" class="heap"/><text x="160" y="205" text-anchor="middle">hello</text><text x="160" y="251" text-anchor="middle" class="small">Dropped when message leaves scope</text></g><text x="510" y="352" text-anchor="middle" class="small">Snapshots show ownership, not physical handle copies. A move does not duplicate the heap text.</text></svg>