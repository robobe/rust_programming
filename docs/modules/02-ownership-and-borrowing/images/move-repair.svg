<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 370" role="img" aria-labelledby="title desc">
<title id="title">Repair by choosing the required owners</title><desc id="desc">Use the current owner - archived_title owns String - Rust ownership - Print archived_title, no clone; Clone alternative: original - title owns allocation A - A: Rust ownership - title stays usable; Clone alternative: copy - archived_title owns B - B: Rust ownership - A and B are independent. Conceptual snapshots, not literal addresses or compiler stack slots.</desc>
<style>text{font:14px sans-serif;fill:#1e293b}.heading{font-weight:700;font-size:17px}.small{font-size:12px}.panel{fill:#fff;stroke:#94a3b8}.owner{fill:#dbeafe;stroke:#2563eb}.heap{fill:#dcfce7;stroke:#16a34a}.released{fill:#f1f5f9;stroke:#64748b;stroke-dasharray:5 4}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker></defs>
<text x="510" y="28" text-anchor="middle" class="heading">Repair by choosing the required owners</text>
<g transform="translate(15 48)"><rect width="320" height="275" rx="10" class="panel"/><text x="160" y="28" text-anchor="middle" class="heading">Use the current owner</text><text x="20" y="58" class="small">Conceptual stack / binding</text><rect x="20" y="68" width="280" height="55" rx="6" class="owner"/><text x="160" y="100" text-anchor="middle">archived_title owns String</text><path d="M160 123 V170" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><text x="20" y="160" class="small">Heap</text><rect x="20" y="177" width="280" height="45" rx="6" class="heap"/><text x="160" y="205" text-anchor="middle">Rust ownership</text><text x="160" y="251" text-anchor="middle" class="small">Print archived_title, no clone</text></g><g transform="translate(350 48)"><rect width="320" height="275" rx="10" class="panel"/><text x="160" y="28" text-anchor="middle" class="heading">Clone alternative: original</text><text x="20" y="58" class="small">Conceptual stack / binding</text><rect x="20" y="68" width="280" height="55" rx="6" class="owner"/><text x="160" y="100" text-anchor="middle">title owns allocation A</text><path d="M160 123 V170" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><text x="20" y="160" class="small">Heap</text><rect x="20" y="177" width="280" height="45" rx="6" class="heap"/><text x="160" y="205" text-anchor="middle">A: Rust ownership</text><text x="160" y="251" text-anchor="middle" class="small">title stays usable</text></g><g transform="translate(685 48)"><rect width="320" height="275" rx="10" class="panel"/><text x="160" y="28" text-anchor="middle" class="heading">Clone alternative: copy</text><text x="20" y="58" class="small">Conceptual stack / binding</text><rect x="20" y="68" width="280" height="55" rx="6" class="owner"/><text x="160" y="100" text-anchor="middle">archived_title owns B</text><path d="M160 123 V170" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><text x="20" y="160" class="small">Heap</text><rect x="20" y="177" width="280" height="45" rx="6" class="heap"/><text x="160" y="205" text-anchor="middle">B: Rust ownership</text><text x="160" y="251" text-anchor="middle" class="small">A and B are independent</text></g><text x="510" y="352" text-anchor="middle" class="small">Snapshots show ownership, not physical handle copies. A move does not duplicate the heap text.</text></svg>